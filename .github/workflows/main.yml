name: CI Backend (karsajobs)

on:
  push:        { branches: [ "karsajobs" ] }
  pull_request:{ branches: [ "karsajobs" ] }

jobs:
  lint-dockerfile:
    name: lint-dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          ./hadolint Dockerfile

  test-app:
    name: test-app (go test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Unit tests
        run: go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    name: build & push (docker)
    runs-on: ubuntu-latest
    needs: [ lint-dockerfile, test-app ]
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/karsajobs:latest
