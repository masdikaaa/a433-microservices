name: CI Frontend (karsajobs-ui)

on:
  push:
    branches: [ "karsajobs-ui" ]
  pull_request:
    branches: [ "karsajobs-ui" ]

jobs:
  lint-dockerfile:
    name: lint-dockerfile (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 -o hadolint
          chmod +x hadolint
          ./hadolint Dockerfile

  build-app-karsajobs-ui:
    name: build-app-karsajobs-ui (docker build & push)
    runs-on: ubuntu-latest
    needs: [ lint-dockerfile ]
    env:
      DOCKER_REPO: ${{ secrets.DOCKER_REPO_FRONTEND }} 
    steps:
      - uses: actions/checkout@v4

      # Kalau file .env TIDAK kamu commit, inject dari secret:
      - name: Ensure .env (optional)
        run: |
          if [ ! -f ".env" ] && [ -n "${{ secrets.VUE_APP_BACKEND }}" ]; then
            echo "VUE_APP_BACKEND=${{ secrets.VUE_APP_BACKEND }}" > .env
          fi
          [ -f ".env" ] && grep VUE_APP_BACKEND .env || true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.PASSWORD_DOCKER_HUB }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_REPO }}:latest
